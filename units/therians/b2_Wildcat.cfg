#textdomain wesnoth-Era_of_Myths

# Uses Forest Lion graphics in 1.19.
# Uses different graphics for ranged fight.

[unit_type]
    id=EOM_Wildcat
    name= _ "Wildcat Therian"
    race=EOM_therian
    {TRAIT_ATTUNED}
#ifver WESNOTH_VERSION >= 1.19.3
    image="units/monsters/cat/tritail-sitting.png"
#else
    image="therians/cat-defend.png"
#endif
    hitpoints=58
    movement_type=EOM_woodland
    movement=6
    experience=100
    level=2
    alignment=neutral
    advances_to=EOM_Tiger,EOM_Panther
    cost=32
    usage=fighter
    description= _ "The people of Theria are known for their pursuit of spirituality. The Therian have also learned to greatly respect nature from their neighbors the Warg. Many Therian attune their spirits to animals which they revere. These Therian are capable of harnessing their inner spiritual power to shift into the animal to which they are attuned.

Therian who value strength, power, and intensity attune to the wild cats. These Therian are brutal in combat when in their attuned form, using their claws, or sometimes even jaws, to shred their enemies and protect their people."
    die_sound={SOUND_LIST:HUMAN_DIE}
#ifver WESNOTH_VERSION >= 1.19.3
    {DEFENSE_ANIM_FILTERED "units/monsters/cat/tritail-defend2.png" "units/monsters/cat/tritail-defend1.png" {SOUND_LIST:DRAKE_HIT} (
        [filter_second_attack]
            name=claws
        [/filter_second_attack]
    )}
    {DEFENSE_ANIM_FILTERED "units/monsters/cat/tritail-fangs-defend2.png" "units/monsters/cat/tritail-fangs-defend1.png" {SOUND_LIST:DRAKE_HIT} (
        [filter_second_attack]
            name=fangs
        [/filter_second_attack]
    )}
#else
    {DEFENSE_ANIM_RANGE "therians/cat-defend.png" "therians/cat-defend.png" jaguar-hit.ogg melee }
#endif
    {DEFENSE_ANIM_RANGE "therians/cat-human.png" "therians/cat-human.png" {SOUND_LIST:HUMAN_HIT} ranged }

    [defense]
        forest=40
        village=50
    [/defense]

#ifver WESNOTH_VERSION >= 1.19.3
    [standing_anim]
        start_time=-50
        [frame]
            image="units/monsters/cat/tritail.png:150"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=-50
        {STANDARD_IDLE_FILTER}
        [frame]
            image="units/monsters/cat/tritail-sitting.png:150"
        [/frame]
    [/standing_anim]
    [pre_movement_anim]
        start_time=0
        {STANDARD_IDLE_FILTER}
        [frame]
            image="units/monsters/cat/tritail-transition[2,1].png:100"
        [/frame]
    [/pre_movement_anim]
    [post_movement_anim]
        start_time=0
        {STANDARD_IDLE_FILTER}
        [frame]
            image="units/monsters/cat/tritail-transition[1,2].png:100"
        [/frame]
    [/post_movement_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="units/monsters/cat/tritail.png:150"
        [/frame]
    [/movement_anim]
#else
    [movement_anim]
        [frame]
            image="therians/cat-moving.png"
        [/frame]
    [/movement_anim]
#endif

    [attack]
        name=claws
        description={STR_CLAWS}
        type=blade
        range=melee
        damage=7
        number=4
        icon=attacks/claws-animal.png
    [/attack]
    [attack]
        name=fangs
        description={STR_BITE}
        type=pierce
        range=melee
        damage=14
        number=2
        icon=attacks/fangs-animal.png
    [/attack]
    [attack]
        name=aura wave
        description=_"aura wave"
        type=impact
        range=ranged
        damage=4
        number=3
        icon=attacks/faerie-fire.png
    [/attack]

#ifver WESNOTH_VERSION < 1.19.3
    [attack_anim]
        [filter_attack]
            name=claws,fangs
        [/filter_attack]
        start_time=-150
        [frame]
            image="therians/cat-attack.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS jaguar-attack.ogg jaguar-miss.ogg -50}
    [/attack_anim]
#else
    [attack_anim]
        [filter_attack]
            name=claws
        [/filter_attack]
        offset=0.0~-0.05:150,-0.05~0.6:150,0.6~0.0:250
        start_time=-300
        [frame]
            image="units/monsters/cat/tritail-claws[1~4,1].png:[70,70,80,80,250]"
        [/frame]
        {SOUND:HIT claws.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=claws
        [/filter_attack]
        value_second=2,4
        offset=0.0~-0.05:150,-0.05~0.6:150,0.6~0.0:250
        start_time=-300
        [frame]
            image="units/monsters/cat/tritail-clawsb[1~4].png:[70,70,80,80]"
        [/frame]
        [frame]
            image="units/monsters/cat/tritail-defend1.png:250"
        [/frame]
        {SOUND:HIT claws.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=fangs
        [/filter_attack]
        cat_offset=0.0~-0.1:300,-0.1~0.65:200,0.65:100,0.65~0.0:300
        cat_y=0:300,0~-8:145,-8~0:125,0:330
        cat_start_time=-500
        [cat_frame]
            image="units/monsters/cat/tritail-fangs[1~5,1].png:[125,150,100,125,150,250]"
            auto_vflip=no
            layer=40
        [/cat_frame]
        offset=0.0~-0.1:300,-0.1~0.65:200,0.65:100,0.65~0.0:300
        start_time=-500
        [frame]
            image="units/monsters/cat/tritail-fangs-shadow.png:[900]"
            layer=39
        [/frame]
        {SOUND:HIT bite.ogg -100}
    [/attack_anim]
#endif

    [attack_anim]
        [filter_attack]
            name=aura wave
        [/filter_attack]
        start_time=-300
        sound_start_time=-50
        [frame]
            image="therians/cat-human.png:500"
        [/frame]
        [sound_frame]
            sound=sword-1.ogg
        [/sound_frame]
        {MISSILE_FRAME_THERIAN_AURA}
    [/attack_anim]

    [draw_weapon_anim]
        [filter_attack]
            range=ranged
        [/filter_attack]
        start_time=-700
        [frame]
#ifver WESNOTH_VERSION < 1.19.3
            image="therians/cat-defend.png:350"
#else
            image="units/monsters/cat/tritail.png:350"
#endif
            blend_ratio="0~1"
            blend_color=255,255,255
        [/frame]
        [frame]
            image="therians/cat-human.png:350"
            blend_ratio="1~0"
            blend_color=255,255,255
        [/frame]
    [/draw_weapon_anim]
    [victory_anim]
        [filter_attack]
            range=ranged
        [/filter_attack]
        [frame]
            # this prevents showing the base image after killing a unit
            image="therians/cat-human.png"
        [/frame]
    [/victory_anim]
    [sheath_weapon_anim]
        [filter_attack]
            range=ranged
        [/filter_attack]
        start_time=0
        [frame]
            image="therians/cat-human.png:350"
            blend_ratio="0~1"
            blend_color=255,255,255
        [/frame]
        [frame]
#ifver WESNOTH_VERSION < 1.19.3
            image="therians/cat-defend.png:350"
#else
            image="units/monsters/cat/tritail.png:350"
#endif
            blend_ratio="1~0"
            blend_color=255,255,255
        [/frame]
    [/sheath_weapon_anim]
[/unit_type]
